name: kitchen_sink
id_format: "K{:03d}"
lifecycle:
  states: [open, reviewed, closed]
  initial_state: open
  transitions:
    - from: open
      to: reviewed
      verb: review
      actor: human
    - from: reviewed
      to: closed
      verb: close
      actor: ai_autonomous

fields:
  - name: title
    type: text
    required: true
    description: "Short title"

  - name: slug
    type: text
    pattern: "^[a-z0-9-]+$"
    description: "URL-safe slug; must match ^[a-z0-9-]+$"

  - name: count
    type: integer
    description: "An integer field"

  - name: active
    type: bool
    description: "A boolean field stored as INTEGER 0/1"

  - name: priority
    type: enum
    enum_values: [low, medium, high]
    description: "An enum field with CHECK constraint"

  - name: tags
    type:
      list: text
    description: "A List<Text> field stored as JSON TEXT"

  - name: ref_id
    type: display_id
    description: "A DisplayId FK field"

  - name: observed_at
    type: timestamp
    description: "A Timestamp field stored as ISO-8601 TEXT"

  - name: triage
    type: record
    fields:
      - name: verdict
        type: text
        description: "Triage verdict (e.g. T1, T2, T3)"
      - name: triage_notes
        type: text
        description: "Free-form triage notes"
    description: "Triage information"

  - name: contract
    type: record
    fields:
      - name: done_when
        type: text
        required_when: "triage.verdict == 'T3'"
        description: "Done criteria — required when verdict is T3"
      - name: scope_in
        type: text
        required_when: "triage.verdict == 'T3'"
        description: "In-scope work — required when verdict is T3"
      - name: scope_out
        type: text
        required_when: "triage.verdict == 'T3'"
        description: "Out-of-scope work — required when verdict is T3"
    description: "Contract fields; sub-fields required when verdict == T3"

  - name: details
    type: record
    fields:
      - name: notes
        type: text
        description: "Free-form notes"
      - name: severity
        type: enum
        enum_values: [info, warning, error]
        required_when: "priority == 'high'"
        description: "Severity, required when priority is high"
    description: "A Record field stored as JSON TEXT"

  - name: metadata
    type: json
    required: false
    description: "Free-shape JSON payload (T008)"
