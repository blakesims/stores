# Sample .stores/agents.yaml fixture (Phase 2).
agents:
  - name: accept-merge
    subscribes_to:
      - store: tasks
        transition:
          from: in_review
          to: accepted
    command: "builtin:accept-merge"
    claim_window_secs: 300
    retry_policy:
      max_attempts: 3
      backoff: linear
  - name: user-escalation
    subscribes_to:
      - store: tasks
        transition:
          from: accepted
          to: deploy_blocked
    command: "builtin:user-escalation"
    claim_window_secs: 300
    retry_policy:
      max_attempts: 1
      backoff: linear
  - name: auto-promote
    subscribes_to:
      - store: observations
        transition:
          from: confirmed
          to: ready
    command: "builtin:auto-promote"
    claim_window_secs: 300
    retry_policy:
      max_attempts: 1
      backoff: linear
  - name: auto-scaffold
    subscribes_to:
      - store: tasks
        transition:
          from: ""
          to: planning
    command: "builtin:auto-scaffold"
    claim_window_secs: 300
    retry_policy:
      max_attempts: 1
      backoff: linear
  - name: investigator
    subscribes_to:
      - store: observations
        transition:
          from: open
          to: needs_investigation
    command: "builtin:investigator"
    claim_window_secs: 600
    retry_policy:
      max_attempts: 1
      backoff: linear
  - name: auto-drive
    subscribes_to:
      - store: tasks
        transition:
          from: ""
          to: planning
        predicate:
          op: "!="
          left: "$workspace_path"
          right: ""
    command: "builtin:auto-drive"
    claim_window_secs: 300
    retry_policy:
      max_attempts: 1
      backoff: linear
  - name: auto-resolve-observation
    subscribes_to:
      - store: tasks
        transition:
          from: cargo_installed
          to: schema_migrated
    command: "builtin:auto-resolve-observation"
    claim_window_secs: 300
    retry_policy:
      max_attempts: 1
      backoff: linear
deployment_specialist: user-escalation
