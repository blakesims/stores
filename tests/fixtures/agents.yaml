# Sample .stores/agents.yaml fixture — durable release-to-integration subscriber,
# generic integration lane, plus the stores-specific post-`integrated` chain.
#
# Kept in sync with docs/agents-yaml-example.yaml for the post-integrate
# agents (integrate, cargo-install, schema-migrate, auto-resolve-observation)
# plus observations-store agents (auto-promote) that the docs example does
# not yet carry. The subscriber-edge contracts in
# src/flow/subscriber_edges.rs evaluate against this file.
agents:
  - name: release-to-integration
    subscribes_to:
      - store: tasks
        transition:
          from: code_review
          to: complete
        predicate:
          op: "=="
          left: "$activation"
          right: "active"
      - store: tasks
        transition:
          from: complete
          to: in_review
        predicate:
          op: "=="
          left: "$activation"
          right: "active"
      - store: tasks
        transition:
          from: in_review
          to: accepted
        predicate:
          op: "=="
          left: "$activation"
          right: "active"
    command: "builtin:release-to-integration"
    claim_window_secs: 300
    retry_policy:
      max_attempts: 1
      backoff: linear

  - name: integrate
    subscribes_to:
      - store: tasks
        transition:
          from: accepted
          to: integration_queued
        predicate:
          op: "=="
          left: "$activation"
          right: "active"
      - store: tasks
        transition:
          from: complete
          to: integration_queued
        predicate:
          op: "=="
          left: "$activation"
          right: "active"
      - store: tasks
        transition:
          from: in_review
          to: integration_queued
        # T140 P2: gate on per-row activation. Only `active` rows enter the
        # integration lane; inactive rows queue but never combust.
        predicate:
          op: "=="
          left: "$activation"
          right: "active"
      - store: tasks
        transition:
          from: integration_blocked
          to: integration_queued
        predicate:
          op: "=="
          left: "$activation"
          right: "active"
    command: "builtin:integrate"
    claim_window_secs: 1800
    retry_policy:
      max_attempts: 1
      backoff: linear
    command_args:
      pre_land_check: "cargo check --quiet"
      refresh_strategy: rebase
      allow_push: false

  - name: cargo-install
    subscribes_to:
      - store: tasks
        transition:
          from: integrating
          to: integrated
    command: "builtin:cargo-install"
    claim_window_secs: 600
    retry_policy:
      max_attempts: 1
      backoff: linear

  - name: schema-migrate
    subscribes_to:
      - store: tasks
        transition:
          from: integrated
          to: integrated
        predicate:
          op: "=="
          left: "$post_integration_step"
          right: "cargo_installed"
    command: "builtin:schema-migrate"
    claim_window_secs: 300
    retry_policy:
      max_attempts: 1
      backoff: linear

  - name: user-escalation
    subscribes_to: []
    command: "builtin:user-escalation"
    claim_window_secs: 300
    retry_policy:
      max_attempts: 1
      backoff: linear

  - name: auto-promote
    subscribes_to:
      - store: observations
        transition:
          from: confirmed
          to: ready
    command: "builtin:auto-promote"
    claim_window_secs: 300
    retry_policy:
      max_attempts: 1
      backoff: linear

  - name: auto-scaffold
    subscribes_to:
      - store: tasks
        transition:
          from: ""
          to: planning
    command: "builtin:auto-scaffold"
    claim_window_secs: 300
    retry_policy:
      max_attempts: 1
      backoff: linear

  - name: investigator
    subscribes_to:
      - store: observations
        transition:
          from: open
          to: needs_investigation
    command: "builtin:investigator"
    claim_window_secs: 600
    retry_policy:
      max_attempts: 1
      backoff: linear

  - name: auto-drive
    subscribes_to:
      - store: tasks
        transition:
          from: ""
          to: planning
        # T140 P2: ignition gate. The row must have a workspace AND be
        # active before auto-drive combusts. AllOf composes the two
        # predicates (the AST does not support compound expressions
        # natively, but exposes the boolean composer).
        predicate:
          op: all_of
          all:
            - op: "!="
              left: "$workspace_path"
              right: ""
            - op: "=="
              left: "$activation"
              right: "active"
    command: "builtin:auto-drive"
    claim_window_secs: 300
    retry_policy:
      max_attempts: 1
      backoff: linear

  - name: auto-resolve-observation
    subscribes_to:
      - store: tasks
        transition:
          from: cargo_installed
          to: schema_migrated
      - store: tasks
        transition:
          from: integrating
          to: integrated
      - store: tasks
        transition:
          from: planning
          to: closed_out_of_band
      - store: tasks
        transition:
          from: plan_review
          to: closed_out_of_band
      - store: tasks
        transition:
          from: ready
          to: closed_out_of_band
      - store: tasks
        transition:
          from: executing
          to: closed_out_of_band
      - store: tasks
        transition:
          from: code_review
          to: closed_out_of_band
      - store: tasks
        transition:
          from: blocked
          to: closed_out_of_band
      - store: tasks
        transition:
          from: complete
          to: closed_out_of_band
      - store: tasks
        transition:
          from: in_review
          to: closed_out_of_band
      - store: tasks
        transition:
          from: rejected
          to: closed_out_of_band
      - store: tasks
        transition:
          from: deploy_blocked
          to: closed_out_of_band
    command: "builtin:auto-resolve-observation"
    claim_window_secs: 300
    retry_policy:
      max_attempts: 1
      backoff: linear

deployment_specialist: user-escalation
