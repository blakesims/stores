# Sample .stores/agents.yaml fixture — generic integration lane plus the
# stores-specific post-`integrated` chain.
#
# Kept in sync with docs/agents-yaml-example.yaml for the post-integrate
# agents (integrate, cargo-install, schema-migrate, auto-resolve-observation)
# plus observations-store agents (auto-promote) that the docs example does
# not yet carry. The subscriber-edge contracts in
# src/flow/subscriber_edges.rs evaluate against this file.
agents:
  - name: integrate
    subscribes_to:
      - store: tasks
        transition:
          from: accepted
          to: integration_queued
      - store: tasks
        transition:
          from: integration_blocked
          to: integration_queued
    command: "builtin:integrate"
    claim_window_secs: 1800
    retry_policy:
      max_attempts: 1
      backoff: linear
    command_args:
      pre_land_check: "cargo check --quiet"
      refresh_strategy: rebase
      allow_push: false

  - name: cargo-install
    subscribes_to:
      - store: tasks
        transition:
          from: integrating
          to: integrated
    command: "builtin:cargo-install"
    claim_window_secs: 600
    retry_policy:
      max_attempts: 1
      backoff: linear

  - name: schema-migrate
    subscribes_to:
      - store: tasks
        transition:
          from: integrated
          to: cargo_installed
    command: "builtin:schema-migrate"
    claim_window_secs: 300
    retry_policy:
      max_attempts: 1
      backoff: linear

  - name: user-escalation
    subscribes_to:
      - store: tasks
        transition:
          from: accepted
          to: deploy_blocked
      - store: tasks
        transition:
          from: cargo_installed
          to: deploy_blocked
    command: "builtin:user-escalation"
    claim_window_secs: 300
    retry_policy:
      max_attempts: 1
      backoff: linear

  - name: auto-promote
    subscribes_to:
      - store: observations
        transition:
          from: confirmed
          to: ready
    command: "builtin:auto-promote"
    claim_window_secs: 300
    retry_policy:
      max_attempts: 1
      backoff: linear

  - name: auto-scaffold
    subscribes_to:
      - store: tasks
        transition:
          from: ""
          to: planning
    command: "builtin:auto-scaffold"
    claim_window_secs: 300
    retry_policy:
      max_attempts: 1
      backoff: linear

  - name: investigator
    subscribes_to:
      - store: observations
        transition:
          from: open
          to: needs_investigation
    command: "builtin:investigator"
    claim_window_secs: 600
    retry_policy:
      max_attempts: 1
      backoff: linear

  - name: auto-drive
    subscribes_to:
      - store: tasks
        transition:
          from: ""
          to: planning
        predicate:
          op: "!="
          left: "$workspace_path"
          right: ""
    command: "builtin:auto-drive"
    claim_window_secs: 300
    retry_policy:
      max_attempts: 1
      backoff: linear

  - name: auto-resolve-observation
    subscribes_to:
      - store: tasks
        transition:
          from: cargo_installed
          to: schema_migrated
      - store: tasks
        transition:
          from: integrating
          to: integrated
      - store: tasks
        transition:
          from: planning
          to: closed_out_of_band
      - store: tasks
        transition:
          from: plan_review
          to: closed_out_of_band
      - store: tasks
        transition:
          from: ready
          to: closed_out_of_band
      - store: tasks
        transition:
          from: executing
          to: closed_out_of_band
      - store: tasks
        transition:
          from: code_review
          to: closed_out_of_band
      - store: tasks
        transition:
          from: blocked
          to: closed_out_of_band
      - store: tasks
        transition:
          from: complete
          to: closed_out_of_band
      - store: tasks
        transition:
          from: in_review
          to: closed_out_of_band
      - store: tasks
        transition:
          from: rejected
          to: closed_out_of_band
      - store: tasks
        transition:
          from: deploy_blocked
          to: closed_out_of_band
    command: "builtin:auto-resolve-observation"
    claim_window_secs: 300
    retry_policy:
      max_attempts: 1
      backoff: linear

deployment_specialist: user-escalation
