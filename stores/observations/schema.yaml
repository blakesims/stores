name: observations
id_format: "L{:03d}"
# No store-level default_actor — fields are unguarded by default; explicit actor per-field only.
# D6 audit-column collision check (T009): none of the 10.06 field names collide with reserved
# audit columns (created_at, created_by, updated_at, updated_by). Verified: captured_at,
# resolved_at, priority_rank_at, locked_at, drafted_at, approved_at are all distinct.

lifecycle:
  states: [open, needs_investigation, investigating, investigated, investigation_failed, confirmed, ready, needs_info, in_progress, resolved, wont_fix]
  initial_state: open
  transitions:
    # open → investigating: triage begins
    # investigate is autonomous (closes L007). Drafting an investigation note
    # does not require user-presence; subsequent confirm + intent_contract
    # approval are the U-moments and remain actor:human / actor:ai_with_human.
    - from: open
      to: investigating
      verb: investigate
      actor: ai_autonomous

    # open → needs_investigation: operator-pull route to the dedicated
    # investigator subagent queue. A human-supervised AI flags specific rows;
    # the framework subscriber performs the spawn and follow-up transitions.
    - from: open
      to: needs_investigation
      verb: request-investigation
      actor: ai_with_human

    # needs_investigation → investigating → investigated/investigation_failed:
    # framework-only edges used by the investigator subscriber. Hidden from the
    # operator CLI; direct observation creation remains status=open.
    - from: needs_investigation
      to: investigating
      verb: investigation-started
      actor: framework
    - from: investigating
      to: investigated
      verb: investigation-succeeded
      actor: framework
    - from: investigating
      to: investigation_failed
      verb: investigation-failed
      actor: framework

    # open → wont_fix: direct discard path (per 10.06 lifecycle diagram)
    - from: open
      to: wont_fix
      verb: wont_fix
      actor: ai_with_human

    # open → resolved: close-as-addressed shortcut (T004 / L017).
    # First propulsion-visible task: drain the queue without walking the full
    # 4-hop investigate → confirm → claim → resolve sequence when an
    # observation has already been addressed by a prior task / observation /
    # commit. Handler requires --resolution <T###|L###|commit-sha> and writes
    # resolved_at atomically; autonomy is appropriate because the reference is
    # an objective, externally-verifiable artifact.
    - from: open
      to: resolved
      verb: close_as_addressed
      actor: ai_autonomous

    # investigating → confirmed: contract must be ready before this fires (clause 2+3 backbone)
    - from: investigating
      to: confirmed
      verb: confirm
      actor: ai_with_human
      guard: "intent_contract.contract_state == 'ready'"

    # confirmed → ready: framework synchronously ratifies the contract immediately
    # after a successful confirm (T020 P1 auto-promote upstream signal). The hook
    # in src/handlers/transition.rs re-checks intent_contract.approved_by /
    # approved_at != null in code (the guard parser does not support compound
    # expressions). actor: framework — only the post-confirm hook fires this.
    - from: confirmed
      to: ready
      verb: ratify
      actor: framework
      guard: "intent_contract.contract_state == 'ready'"

    # investigating → needs_info: request more context
    - from: investigating
      to: needs_info
      verb: request_info
      actor: ai_autonomous

    # confirmed → needs_info: parking (clause 7)
    - from: confirmed
      to: needs_info
      verb: park
      actor: ai_autonomous

    # needs_info → confirmed: human provides the missing context (clause 7 resume)
    - from: needs_info
      to: confirmed
      verb: provide_info
      actor: human

    # confirmed → in_progress: claim the work
    - from: confirmed
      to: in_progress
      verb: claim
      actor: ai_autonomous

    # in_progress → resolved: work done
    - from: in_progress
      to: resolved
      verb: resolve
      actor: ai_autonomous

    # confirmed → wont_fix: bailout after investigation
    - from: confirmed
      to: wont_fix
      verb: wont_fix
      actor: ai_with_human

    # auto_resolve: framework-fired by the auto-resolve-observation subscriber
    # when the observation's linked task hits cargo_installed → schema_migrated.
    # Mirror image of auto-promote (T020 P1) — the upstream ratify created the
    # task; this closes the back-link by setting status=resolved and resolution
    # to the task's commit_sha. T037 P1.
    #
    # Source states cover every state where auto-promotion or direct promotion
    # could have left an observation. wont_fix and resolved are intentionally
    # excluded (terminal states; no auto-resolve from there).
    - from: open
      to: resolved
      verb: auto_resolve
      actor: framework
    - from: investigating
      to: resolved
      verb: auto_resolve
      actor: framework
    - from: confirmed
      to: resolved
      verb: auto_resolve
      actor: framework
    - from: ready
      to: resolved
      verb: auto_resolve
      actor: framework
    - from: needs_info
      to: resolved
      verb: auto_resolve
      actor: framework
    - from: in_progress
      to: resolved
      verb: auto_resolve
      actor: framework

fields:
  # --- Core identity ---
  - name: summary
    type: text
    required: true
    description: "One-line summary of the observation"

  - name: body
    type: text
    required: false
    description: "Extended description; supports --body-from-file"

  # --- Source / origin ---
  - name: source
    type: enum
    enum_values: [dashboard, qa, dev, sentry, intake, converge, wrap]
    required: true
    description: "Where this observation originated"

  - name: source_id
    type: integer
    required: false
    description: "Primary key in the source system (dashboard row id, etc.)"

  - name: prod_source_id
    type: integer
    required: false
    description: "Production environment source id (dashboard sync)"

  - name: sandbox_source_id
    type: integer
    required: false
    description: "Sandbox environment source id (dashboard sync)"

  - name: origin_db
    type: enum
    enum_values: [prod, sandbox]
    required: false
    description: "Which database the source record lives in"

  # --- Priority / scheduling ---
  - name: priority
    type: enum
    enum_values: [high, normal, low]
    required: true
    description: "Observation priority"

  - name: priority_rank
    type: integer
    required: false
    description: "Ordered rank within the priority tier (written by /focus)"

  - name: priority_rank_at
    type: timestamp
    required: false
    description: "When priority_rank was last written"

  - name: scheduled_for
    type: text
    required: false
    description: "Target date or sprint slot (operator-hygiene, no pattern)"

  # --- Capture metadata ---
  - name: captured_at
    type: text
    required: true
    description: "ISO timestamp when the observation was captured"

  - name: captured_week
    type: text
    required: true
    description: "Operator week label (e.g. w11-d4); no pattern enforced per D2"

  - name: contact_id
    type: integer
    required: false
    description: "Contact the observation is associated with"

  - name: field_name
    type: text
    required: false
    description: "Specific field name within the contact record, if applicable"

  # --- QA-source dedup keys ---
  - name: qa_item_id
    type: integer
    required: false
    description: "QA checklist item id (source=qa dedup)"

  - name: tour_session_id
    type: integer
    required: false
    description: "Tour session id (source=qa dedup)"

  - name: step_index
    type: integer
    required: false
    description: "Step index within tour session (source=qa dedup)"

  - name: staff_user_id
    type: integer
    required: false
    description: "Staff user who triggered the QA observation"

  - name: message
    type: text
    required: false
    description: "Raw message text from the QA step (dedup key)"

  # --- Capability surface ---
  - name: capability
    type: text
    required: false
    description: "Primary capability affected (dashboard surface label)"

  - name: capability_ids
    type:
      list: text
    required: false
    description: "Capability ids this observation touches"

  # --- Investigation / resolution ---
  - name: investigation_note
    type: text
    required: false
    description: "Free-form notes accumulated during investigation"

  - name: investigation_failure_reason
    type: text
    required: false
    description: "Framework-captured investigator spawn/rate-limit/nonzero failure details"

  - name: resolved_at
    type: text
    required: false
    description: "ISO timestamp when the observation was resolved"

  - name: resolution
    type: text
    required: false
    description: "How the observation was resolved"

  - name: pending_architecture_review
    type: bool
    required: false
    default: false
    description: "True when a routed architecture_reviews A### ruling must clear this observation before U1 ratification."

  - name: clearable_by_ruling
    type: text
    required: false
    pattern: "^A[0-9]{3,}$"
    description: "Soft-FK to architecture_reviews.display_id (A###) whose verdict can clear pending_architecture_review."

  - name: resolved_by
    type: text
    required: false
    pattern: "^A[0-9]{3,}$"
    description: "Architecture review A### that resolved this observation through merge_with_cluster."

  - name: reframe_acknowledged_against
    type: text
    required: false
    pattern: "^A[0-9]{3,}$"
    description: "Architecture ruling A### acknowledged by a reconciled intent contract after reframe_contract."

  - name: merge_target_id
    type: text
    required: false
    pattern: "^L[0-9]{3,}$"
    description: "Target observation L### when this observation is merged into an architecture cluster."

  - name: resolution_kind
    type: enum
    enum_values: [addressed_by_task, addressed_by_observation, addressed_by_commit, auto_resolved, merged_with_cluster]
    required: false
    description: "Typed resolution category; merged_with_cluster is reserved for architecture-review merge redirects."

  # --- Cross-store reference (soft-FK, plain text per D4) ---
  - name: task_id
    type: text
    required: false
    description: "Display id of the linked task (e.g. T123); soft-FK, no referential guard (T010)"

  # --- Concurrency primitive (actor:framework, mirrors tasks claimed_by pattern, per D5) ---
  - name: locked_by
    type: text
    required: false
    actor: framework
    description: "Agent or process that holds the lock"

  - name: locked_at
    type: timestamp
    required: false
    actor: framework
    description: "When the lock was acquired"

  - name: lock_reason
    type: text
    required: false
    actor: framework
    description: "Why the lock was taken"

  # --- Tags ---
  - name: tags
    type:
      list: text
    required: false
    description: "Tags for filtering"

  # --- Intent contract (D9-compliant; 15 sub-fields; mirrors 10.06 production) ---
  - name: intent_contract
    type: record
    description: "Structured brief gating the confirmed transition; sub-fields required when contract_state == ready"
    fields:
      # Contract lifecycle
      - name: contract_state
        type: enum
        enum_values: [draft, ready]
        actor: ai_with_human
        description: "draft = AI-authored; ready = Blake-approved; ready requires human-supervised authority"

      - name: drafted_by
        type: text
        description: "Agent or skill that authored the draft"

      - name: drafted_at
        type: timestamp
        description: "When the draft was written"

      - name: updated_at
        type: timestamp
        required: false
        description: "When the intent contract was last amended/reconciled for architecture reframe checks"

      # Core scope (required_when ready)
      - name: objective
        type: text
        required_when: "intent_contract.contract_state == 'ready'"
        description: "One-line goal — what done means"

      - name: type
        type: enum
        enum_values: [work, investigation]
        required_when: "intent_contract.contract_state == 'ready'"
        description: "work = known fix; investigation = root cause unknown"

      - name: in_scope
        type:
          list: text
        required_when: "intent_contract.contract_state == 'ready'"
        description: "Bulleted list of in-scope items"

      - name: out_of_scope
        type:
          list: text
        required_when: "intent_contract.contract_state == 'ready'"
        description: "Bulleted list of out-of-scope items (name the creep vectors)"

      - name: acceptance
        type:
          list: text
        required_when: "intent_contract.contract_state == 'ready'"
        description: "Testable / observable done-criteria"

      - name: tier_hint
        type: enum
        enum_values: [T1, T2, T3]
        required_when: "intent_contract.contract_state == 'ready'"
        description: "Floor tier; /task:open may step UP, never DOWN"

      # Optional contract metadata
      - name: inputs
        type:
          list: text
        required: false
        description: "Gates / observations / refs / capabilities this depends on"

      - name: touches
        type:
          list: text
        required: false
        description: "Drives /task:open tier recomputation (webhook, migration, secret, capability, cross_system)"

      - name: affects_capability
        type: text
        required: false
        description: "Capability code (C01-C18); null if infra-only"

      - name: known_solution
        type: text
        required: false
        description: "Sketch of the fix; null signals investigation needed first"

      # Approval (actor:human + required_when ready — only Blake can ratify).
      # T001 P3: actor:human is now reachable via --invoker ai_with_human +
      # --approve-token <T> (token-mediated assent). Pure --invoker human still
      # works; --invoker ai_autonomous is still rejected unconditionally.
      - name: approved_by
        type: text
        actor: human
        required_when: "intent_contract.contract_state == 'ready'"
        description: "Who approved the contract (always blake for now); writable via --invoker human OR --invoker ai_with_human --approve-token <T>"

      - name: approved_at
        type: timestamp
        actor: human
        required_when: "intent_contract.contract_state == 'ready'"
        description: "When the contract was approved; writable via --invoker human OR --invoker ai_with_human --approve-token <T>"

  # --- Evidence record (list_record of external refs; T006 P2 substrate) ---
  - name: evidence
    type: record
    description: "Supporting evidence for the observation"
    fields:
      - name: observed_at
        type: timestamp
        required: false
        description: "When the evidence was captured"

      - name: env
        type: text
        required: false
        description: "Environment in which the evidence was observed (prod, sandbox, local)"

      - name: external_refs
        type: list_record
        description: "External system references (Sentry, JIRA, etc.)"
        fields:
          - name: system
            type: text
            required: true
            description: "External system name (e.g. sentry, linear)"
          - name: kind
            type: text
            required: true
            description: "Reference kind (e.g. issue, event)"
          - name: id
            type: text
            required: true
            description: "Identifier in the external system"

  # --- Risk & policy taxonomy (T052) ---
  # P2 schema-prep for the gatekeeper (L142). The four fields promote the
  # (risk_class, approval_policy, risk_flags, cluster_key) tuple from prose
  # in docs/risk-and-cluster-taxonomy.md into typed columns so risk and
  # policy are queryable / enforceable / audit-able. Conservative defaults
  # apply to every existing row at migration time and to every new row when
  # the CLI does not supply an override. actor: ai_with_human gates explicit
  # writes — autonomous filing cannot supply these flags.
  - name: risk_class
    type: enum
    enum_values: [low, normal, architecture, security, authority]
    required: false
    actor: ai_with_human
    default: 'normal'
    description: "Risk class taxonomy entry (default 'normal')"

  - name: approval_policy
    type: enum
    enum_values: [auto, human, architecture]
    required: false
    actor: ai_with_human
    default: 'human'
    description: "Approval policy floor (default 'human')"

  - name: risk_flags
    type:
      list: text
    required: false
    actor: ai_with_human
    default: []
    list_enum:
      - touches_actor_authority
      - touches_lifecycle
      - touches_subscriber_semantics
      - introduces_new_primitive
      - changes_boundary
      - security_sensitive
      - docs_only
      - small_local_fix
      - duplicate_symptom
      - touches_runner_boundary
      - touches_schema_core
      - authority_surface_drift
      - contradicts_prior_decision
    description: "Canonical risk-flag enum tags (array membership validated separately)"

  - name: cluster_key
    type: text
    required: false
    actor: ai_with_human
    pattern: '^[a-z][a-z0-9-]{2,40}$'
    description: "Optional cluster key linking related observations (slug-like)"

  # --- Notes (free-shape JSON; T008 substrate) ---
  - name: notes
    type: json
    required: false
    description: "Free-shape catch-all (siblings, discovery_path, related_observations, tried_repros, user_quotes, etc.)"
