name: gate
id_format: "G{:03d}"
# No store-level default_actor — fields are unguarded by default; only `answer` requires `human`.
lifecycle:
  states: [pending, answered, cancelled]
  transitions:
    - from: pending
      to: answered
      verb: answer
      actor: human
    - from: pending
      to: cancelled
      verb: cancel
      actor: ai_autonomous

fields:
  - name: type
    type: enum
    enum_values: [decision, script]
    required: true
    description: "Gate type: decision (human chooses) or script (automated)"

  - name: question
    type: text
    required: true
    description: "The question posed at this gate"

  - name: options
    type:
      list: text
    required: false
    description: "Possible answers; pipe-separated on CLI: \"soft|hard\""

  - name: answer
    type: text
    required: false
    actor: human
    description: "The chosen answer — human actor required"

  - name: task_ref
    type: text
    required: false
    description: "Cross-store reference to a task display_id (e.g. L001); no FK enforced"

  - name: priority
    type: enum
    enum_values: [high, normal, low]
    required: false
    description: "Filing priority — used by /task:open's Blake-only-step pattern (D1/Q1)"
