name: intake
id_format: "I{:03d}"
# No store-level default_actor — fields are unguarded by default; explicit actor per-field only.
# Lifecycle doc: docs/gatekeeper-design.md § Lifecycle

lifecycle:
  states: [draft, triaging, needs_info, routed, dropped]
  initial_state: draft
  transitions:
    - {from: draft, to: triaging, verb: claim-triage, actor: ai_autonomous, lifecycle: triaging, waiting_kind: triage_capacity, legacy_status: triaging}
    - {from: triaging, to: needs_info, verb: route, actor: ai_autonomous, guard: "decision == 'needs_info'", lifecycle: waiting, waiting_kind: evidence_needed, legacy_status: needs_info}
    - {from: triaging, to: routed, verb: route, actor: ai_autonomous, guard: "decision == 'duplicate'", lifecycle: closed, outcome: marked_duplicate, legacy_status: routed}
    - {from: triaging, to: routed, verb: route, actor: ai_autonomous, guard: "decision == 'fast_track'", lifecycle: closed, outcome: fast_tracked, legacy_status: routed}
    - {from: triaging, to: routed, verb: route, actor: ai_autonomous, guard: "decision == 'normal_observation'", lifecycle: closed, outcome: routed_to_observation, legacy_status: routed}
    - {from: triaging, to: routed, verb: route, actor: ai_autonomous, guard: "decision == 'arch_review_candidate'", lifecycle: closed, outcome: escalated_to_architecture_review, legacy_status: routed}
    - {from: triaging, to: dropped, verb: route, actor: ai_autonomous, guard: "decision == 'reject_noise'", lifecycle: closed, outcome: dropped_as_noise, legacy_status: dropped}
    - {from: needs_info, to: triaging, verb: recon-return, actor: ai_autonomous, lifecycle: triaging, legacy_status: triaging}
    - {from: dropped, to: draft, verb: reopen, actor: ai_with_human, lifecycle: new, legacy_status: draft}
    - {from: dropped, to: triaging, verb: amend, actor: ai_with_human, lifecycle: triaging, legacy_status: triaging}


workflow:
  agent_roles:
    gatekeeper:
      description: "Classifies intake items into one of six gatekeeper routing decisions"
    recon:
      description: "Gathers narrow evidence for needs_info round-trips"
  briefing_templates:
    gatekeeper: "templates/gatekeeper-brief.md.tpl"
    recon: "templates/recon-brief.md.tpl"
  on_state:
    triaging:
      - dispatch_agent: gatekeeper
    needs_info:
      - dispatch_agent: recon

fields:
  # --- ADR 0002 primary model (status remains compatibility-only legacy projection). ---
  - name: lifecycle
    type: enum
    enum_values: [new, triaging, waiting, closed]
    required: false
    default: new
    actor: framework
    description: "ADR 0002 inlet lifecycle primary column; legacy status is compatibility-only projection."

  - name: waiting_kind
    type: enum
    enum_values: [evidence_needed, triage_capacity, external_input]
    required: false
    actor: framework
    description: "ADR 0002 inlet waiting kind primary column."

  - name: outcome
    type: enum
    enum_values: [routed_to_observation, marked_duplicate, fast_tracked, escalated_to_architecture_review, dropped_as_noise]
    required: false
    actor: framework
    description: "ADR 0002 inlet outcome primary column."

  # --- Core identity ---
  - name: summary
    type: text
    required: true
    description: "One-line summary of the intake item"

  - name: body
    type: text
    required: false
    description: "Extended description; supports --body-from-file"

  # --- Source / origin ---
  - name: source_task
    type: text
    required: false
    description: "Soft-FK to tasks.display_id (T###); plain text, no referential guard"

  - name: source_agent
    type: text
    required: true
    description: "Role name of the filing agent (planner, executor, code_reviewer, orchestrator, ...)"

  # --- Filing metadata ---
  - name: suggested_fix
    type: text
    required: false
    description: "Raw filer's proposal; advisory only, not policy"

  - name: evidence
    type: text
    required: false
    description: "ndjson of recon findings (paths, greps, repro); ndjson line per finding: {kind, path, line?, snippet?, summary}"

  # --- Gatekeeper decision ---
  - name: gatekeeper_decision_json
    type: json
    required: false
    description: "Full structured-output payload from gatekeeper agent (see docs/gatekeeper-design.md § Gatekeeper output schema)"

  - name: decision
    type: enum
    enum_values: [duplicate, needs_info, fast_track, normal_observation, arch_review_candidate, reject_noise]
    required: false
    description: "Routing decision; set during route transition"

  - name: decision_metadata
    type: json
    required: false
    description: "Additional metadata about the gatekeeper decision (rationale, confidence, tier_hint)"

  # --- Risk / cluster indexing (mirrored from gatekeeper_decision_json for indexed queries) ---
  - name: risk_flags
    type: json
    required: false
    description: "Risk flags array mirrored from gatekeeper_decision_json for indexed queries; no re-parse needed"

  - name: cluster_key
    type: text
    required: false
    pattern: "^[a-z][a-z0-9-]{2,40}$"
    description: "Cluster key mirrored from gatekeeper_decision_json; kebab-case, e.g. dispatch-lifecycle"

  # --- Routing cross-references (soft-FK, plain text per D4) ---
  # ADR 0002 alias: duplicate_of IS duplicate_of_id.
  - name: duplicate_of
    type: text
    required: false
    required_when: "decision == 'duplicate'"
    description: "Soft-FK to intake_items.display_id (I###) when decision=duplicate; ADR 0002 duplicate_of_id."

  # ADR 0002 alias: routed_to_observation IS produced_observation_id.
  - name: routed_to_observation
    type: text
    required: false
    required_when: "decision IN ['normal_observation', 'arch_review_candidate']"
    description: "Soft-FK to observations.display_id (L###) when decision=normal_observation or arch_review_candidate; ADR 0002 produced_observation_id."

  # ADR 0002 alias: routed_to_arch_review IS produced_architecture_review_id.
  - name: routed_to_arch_review
    type: text
    required: false
    pattern: "^A[0-9]{3,}$"
    description: "Soft-FK to architecture_reviews.display_id (A###) created for decision=arch_review_candidate; ADR 0002 produced_architecture_review_id."

  - name: produced_task_id
    type: text
    required: false
    actor: framework
    description: "ADR 0002 typed reference: T### task produced by fast-track routing."

  - name: produced_artifact_kind
    type: enum
    enum_values: [observation, architecture_review, task, commit, other]
    required: false
    actor: framework
    description: "ADR 0002 generic produced-artifact discriminator for tooling."

  - name: produced_artifact_id
    type: text
    required: false
    actor: framework
    description: "ADR 0002 canonical id of produced artifact for generic tooling."

  # --- Recon loop counter ---
  - name: recon_round
    type: integer
    required: false
    description: "0 on draft; incremented on each needs_info → triaging recon return; max 2 before gatekeeper must decide"

  # --- Recon question (set when decision=needs_info; extracted from gatekeeper_decision_json) ---
  - name: missing_info_question
    type: text
    required: false
    description: "Question the gatekeeper needs answered before routing; persisted from gatekeeper_decision_json.missing_info_question"

  # --- Capture metadata ---
  - name: captured_at
    type: text
    required: true
    description: "ISO timestamp when the intake item was captured"

  - name: captured_week
    type: text
    required: true
    description: "Operator week label (e.g. w18-d3); mirrors observations convention"
