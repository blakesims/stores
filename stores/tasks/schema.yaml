name: tasks
id_format: "T{:03d}"
scope: repo

fields:
  - {name: title, type: text, required: true, actor: ai_with_human}
  - {name: slug, type: text, required: true, pattern: "^[a-z0-9-]+$", actor: ai_with_human}
  - {name: branch, type: text, required: false}
  - {name: workspace_path, type: text, required: false}
  - {name: capability, type: text}
  - {name: sub_item, type: text}
  - {name: infra, type: text}
  - {name: depends_on, type: list_fk, ref: tasks}
  - {name: linked_observations, type: list_fk, ref: observations}
  - name: tier_hint
    type: enum
    enum_values: [T1, T2, T3]
    required: false
    description: "Triage tier (T1|T2|T3); inheritable from linked_observations when unanimous, else required explicitly"
  - name: contract
    type: record
    fields:
      - {name: executive_intent, type: text}
      - {name: done_when, type: text, required: true}
      - {name: scope_in, type: text, required: true}
      - {name: scope_out, type: text, required: true}
      - {name: assumptions, type: text}
  - name: plan
    type: record
    fields:
      - {name: objective, type: text}
      - name: phases
        type: list_record
        fields:
          - {name: name, type: text}
          - {name: objective, type: text}
          - {name: tasks, type: {list: text}}
          - {name: acceptance_criteria, type: {list: text}}
          - {name: files, type: {list: text}}
          - {name: dependencies, type: {list: text}}
  - name: plan_review_log
    type: list_record
    fields:
      - {name: gate, type: enum, enum_values: [READY, NEEDS_WORK, NOT_READY]}
      - {name: summary, type: text}
      - {name: open_questions, type: {list: text}}
      - {name: at, type: timestamp}
      - name: reviewed_plan
        type: record
        required: false
        fields: []
  - name: cycles
    type: list_record
    fields:
      - {name: phase, type: integer}
      - {name: cycle, type: integer}
      - name: executor
        type: record
        fields:
          - {name: summary, type: text}
          - {name: commit, type: text}
          - {name: files_changed, type: {list: text}}
          - {name: notes, type: text}
          - {name: at, type: timestamp}
      - name: review
        type: record
        fields:
          - {name: gate, type: enum, enum_values: [PASS, REVISE, FAIL]}
          - {name: critical, type: integer}
          - {name: major, type: integer}
          - {name: minor, type: integer}
          - {name: summary, type: text}
          - {name: details, type: text}
          - {name: at, type: timestamp}
  - {name: current_phase, type: integer, actor: framework, auto_increment: true}
  - {name: current_cycle, type: integer, actor: framework, auto_increment: true, auto_increment_within: current_phase}
  - name: plan_source
    type: enum
    enum_values: [contract_synthesized, planner_authored]
    required: false
    actor: framework
    description: "Provenance label for the plan record: contract_synthesized when the framework derived a one-phase plan from the contract during skip-plan (T1); planner_authored when the planner agent submitted the plan via submit-plan (T2/T3)."
  - {name: claimed_by, type: text, actor: framework}
  - {name: claimed_at, type: timestamp, actor: framework}
  - {name: blocked_reason, type: text}
  - {name: abandoned_reason, type: text, required: false, actor: framework}
  - {name: abandoned_at, type: timestamp, required: false, actor: framework}
  - {name: drive_pid, type: integer, required: false, actor: framework}
  - {name: drive_started_at, type: timestamp, required: false, actor: framework}
  - name: wrap_log
    type: list_record
    fields:
      - {name: executive_summary, type: text}
      - {name: deviations, type: {list: text}}
      - {name: residual_risks, type: {list: text}}
      - {name: recommended_sanity_checks, type: {list: text}}
      - {name: reject_reason, type: text}
      - {name: at, type: timestamp}

lifecycle:
  states: [planning, plan_review, ready, executing, code_review, blocked, complete, in_review, accepted, rejected, deploy_blocked, cargo_installed, schema_migrated, closed_out_of_band, abandoned]
  initial_state: planning
  transitions:
    # close-out-of-band: tier-A recovery terminal for tasks whose work merged
    # to main without going through the substrate's accept verb (typical for
    # tasks where review/wrap/accept were skipped). Refused from terminal-ish
    # states (accepted, cargo_installed, schema_migrated, closed_out_of_band);
    # allowed from every other state. The `--commit` SHA is the merge-target
    # provenance and is recorded in transition_history.actor_note.
    - {from: planning, to: closed_out_of_band, verb: close-out-of-band, actor: human}
    - {from: plan_review, to: closed_out_of_band, verb: close-out-of-band, actor: human}
    - {from: ready, to: closed_out_of_band, verb: close-out-of-band, actor: human}
    - {from: executing, to: closed_out_of_band, verb: close-out-of-band, actor: human}
    - {from: code_review, to: closed_out_of_band, verb: close-out-of-band, actor: human}
    - {from: blocked, to: closed_out_of_band, verb: close-out-of-band, actor: human}
    - {from: complete, to: closed_out_of_band, verb: close-out-of-band, actor: human}
    - {from: in_review, to: closed_out_of_band, verb: close-out-of-band, actor: human}
    - {from: rejected, to: closed_out_of_band, verb: close-out-of-band, actor: human}
    - {from: deploy_blocked, to: closed_out_of_band, verb: close-out-of-band, actor: human}

    # planning → plan_review (submit-plan)
    - {from: planning, to: plan_review, verb: submit-plan, actor: ai_autonomous}

    # planning → ready (skip-plan: T1 tasks bypass planner+plan_review; contract IS the plan)
    - {from: planning, to: ready, verb: skip-plan, actor: framework, guard: "tier_hint == 'T1'"}

    # plan_review → ready / planning / blocked (gate-keyed by submit-plan-review)
    - {from: plan_review, to: ready, verb: submit-plan-review, actor: ai_autonomous, requires_gate: READY}
    - {from: plan_review, to: planning, verb: submit-plan-review, actor: ai_autonomous, requires_gate: NEEDS_WORK, guard: "plan_review_log.length < 3"}
    # Falls through when above guard fails (4th NEEDS_WORK)
    - {from: plan_review, to: blocked, verb: submit-plan-review, actor: ai_autonomous, requires_gate: NEEDS_WORK}
    - {from: plan_review, to: blocked, verb: submit-plan-review, actor: ai_autonomous, requires_gate: NOT_READY}

    # ready → executing (framework, fired on entry via on_state.ready)
    - {from: ready, to: executing, verb: start, actor: framework}

    # executing → code_review (submit-execute)
    - {from: executing, to: code_review, verb: submit-execute, actor: ai_autonomous}

    # code_review → executing / complete / blocked (gate-keyed; PASS branches by current_phase guard per M9)
    # T054: T1 rows now carry a synthesized one-phase plan written during the
    # skip-plan on-entry cascade, so the generic phase-guarded PASS branches
    # below cover T1 correctly (current_phase >= plan.phases.length == 1 ⇒
    # complete). The previously declared T1-specific PASS-to-complete row
    # (with guard `tier_hint == 'T1'`) became redundant once plan IS NULL was
    # eliminated as a T1 representation; it has been removed.
    # PASS-non-last: bump current_phase, reset current_cycle, return to executing
    - {from: code_review, to: executing, verb: submit-review, actor: ai_autonomous, requires_gate: PASS, guard: "current_phase < plan.phases.length"}
    # PASS-last: complete
    - {from: code_review, to: complete, verb: submit-review, actor: ai_autonomous, requires_gate: PASS, guard: "current_phase >= plan.phases.length"}
    # REVISE: bump current_cycle (post-increment guard <= 4 means cycles 2/3/4 OK)
    - {from: code_review, to: executing, verb: submit-review, actor: ai_autonomous, requires_gate: REVISE, guard: "current_cycle <= 4"}
    # REVISE-fallback: 4th-revise routes to blocked (no guard; selected when REVISE→executing's guard fails)
    - {from: code_review, to: blocked, verb: submit-review, actor: ai_autonomous, requires_gate: REVISE}
    # FAIL: code-reviewer hard-fail goes to blocked
    - {from: code_review, to: blocked, verb: submit-review, actor: ai_autonomous, requires_gate: FAIL}

    # blocked recovery: resume continues the work cycle. Plan-empty rows go
    # back through planning; plan-populated rows resume ready→executing.
    # deploy_blocked is release-ceremony recovery, not work-cycle resume:
    # use retry-deploy after fixing the deploy issue, or close-out-of-band
    # when manually recovered outside the substrate.
    - {from: blocked, to: planning, verb: resume, actor: ai_with_human, guard: "plan.length == 0"}
    - {from: blocked, to: ready, verb: resume, actor: ai_with_human}

    # {planning, plan_review, ready, executing, code_review} → blocked (framework, fired by auto-drive subscriber on drive failure)
    - {from: planning, to: blocked, verb: mark_drive_failed, actor: framework}
    - {from: plan_review, to: blocked, verb: mark_drive_failed, actor: framework}
    - {from: ready, to: blocked, verb: mark_drive_failed, actor: framework}
    - {from: executing, to: blocked, verb: mark_drive_failed, actor: framework}
    - {from: code_review, to: blocked, verb: mark_drive_failed, actor: framework}

    # accepted → deploy_blocked (framework, fired by accept-merge agent on conflict)
    - {from: accepted, to: deploy_blocked, verb: mark_deploy_blocked, actor: framework}
    # deploy_blocked recovery: retry the release ceremony from the accepted edge
    # after fixing the underlying deploy issue. Do not use resume here.
    - {from: deploy_blocked, to: accepted, verb: retry-deploy, actor: ai_with_human}

    # accepted → cargo_installed (framework, fired by builtin:cargo-install on success)
    - {from: accepted, to: cargo_installed, verb: mark_cargo_installed, actor: framework}
    # cargo_installed → schema_migrated (framework, fired by builtin:schema-migrate on success)
    - {from: cargo_installed, to: schema_migrated, verb: mark_schema_migrated, actor: framework}
    # cargo_installed → deploy_blocked (framework, fired by builtin:schema-migrate on failure)
    - {from: cargo_installed, to: deploy_blocked, verb: mark_deploy_blocked, actor: framework}

    # complete → in_review (framework on-entry follow-on)
    - {from: complete, to: in_review, verb: request_review, actor: framework}
    # External review revision route for T2/T3 rows. T1 remains lightweight by
    # default: skip-plan T1 rows do not require an external_review PASS unless a
    # later phase explicitly opts them into that lane.
    - {from: in_review, to: executing, verb: submit-external-review, actor: framework, requires_gate: REVISE}

    # in_review → accepted / rejected (human gated)
    - {from: in_review, to: accepted, verb: accept, actor: human}
    - {from: in_review, to: rejected, verb: reject, actor: human}
    # rejected → planning (amend: re-open contract authoring)
    - {from: rejected, to: planning, verb: amend, actor: ai_with_human}

    # <non_terminal> → abandoned (T043: walk a stale row to terminal abandoned without burning a drive cycle)
    - {from: planning, to: abandoned, verb: abandon, actor: human}
    - {from: plan_review, to: abandoned, verb: abandon, actor: human}
    - {from: ready, to: abandoned, verb: abandon, actor: human}
    - {from: executing, to: abandoned, verb: abandon, actor: human}
    - {from: code_review, to: abandoned, verb: abandon, actor: human}
    - {from: blocked, to: abandoned, verb: abandon, actor: human}
    - {from: in_review, to: abandoned, verb: abandon, actor: human}
    - {from: deploy_blocked, to: abandoned, verb: abandon, actor: human}
    - {from: complete, to: abandoned, verb: abandon, actor: human}

workflow:
  max_revise_cycles: 3
  agent_roles:
    planner:
      description: "Creates implementation plans"
    plan_reviewer:
      description: "Reviews plans, READY/NEEDS_WORK/NOT_READY gate"
    executor:
      description: "Executes one phase"
    code_reviewer:
      description: "Reviews phase output, PASS/REVISE/FAIL gate"
    wrap:
      description: "Synthesises completed task into a reviewer brief"
  briefing_templates:
    planner: "templates/planner-brief.md.tpl"
    plan_reviewer: "templates/plan-reviewer-brief.md.tpl"
    executor: "templates/executor-brief.md.tpl"
    code_reviewer: "templates/code-reviewer-brief.md.tpl"
    wrap: "templates/wrap-brief.md.tpl"
  render_template: "templates/main.md.tpl"
  render_target_path: "tasks/{{status_dir}}/{{display_id}}-{{slug}}/main.md"
  submit_targets:
    submit-plan: plan
    submit-plan-review: plan_review_log
    submit-execute: cycles
    submit-review: cycles
    submit-wrap: wrap_log
  on_state:
    planning:
      - {dispatch_agent: planner, when: "tier_hint != 'T1'"}
      - {transition_to: ready, when: "tier_hint == 'T1'"}
    plan_review:
      - dispatch_agent: plan_reviewer
    ready:
      - transition_to: executing
    executing:
      - dispatch_agent: executor
    code_review:
      - dispatch_agent: code_reviewer
    blocked: []
    deploy_blocked: []
    complete:
      - transition_to: in_review
    in_review:
      - dispatch_agent: wrap
