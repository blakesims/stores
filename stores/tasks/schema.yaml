name: tasks
id_format: "T{:03d}"
scope: repo

fields:
  - {name: title, type: text, required: true, actor: ai_with_human}
  - {name: slug, type: text, required: true, pattern: "^[a-z0-9-]+$", actor: ai_with_human}
  - {name: branch, type: text, required: false}
  - name: human_acceptance_policy
    type: enum
    enum_values: [required, optional, delegated_by_policy]
    required: false
    actor: ai_with_human
    default: optional
  - name: task_review_policy
    type: enum
    enum_values: [none, advisory, authoritative, both]
    required: false
    actor: ai_with_human
    default: none
  - name: acceptance_decided_by
    type: enum
    enum_values: [human, policy_delegate]
    required: false
    actor: framework
  - {name: acceptance_decided_at, type: timestamp, required: false, actor: framework}
  - {name: workspace_path, type: text, required: false}
  - {name: capability, type: text}
  - {name: sub_item, type: text}
  - {name: infra, type: text}
  - {name: depends_on, type: list_fk, ref: tasks}
  - {name: linked_observations, type: list_fk, ref: observations}
  - name: tier_hint
    type: enum
    enum_values: [T1, T2, T3]
    required: false
    description: "Triage tier (T1|T2|T3); inheritable from linked_observations when unanimous, else required explicitly"
  # ADR 0001: the reserved status column is compatibility-only. Task-engine
  # semantics are stored in lifecycle/active_step/integration_step/blocked/
  # blocker_kind/post_integration_step and status is retained only as a legacy
  # projection for older readers.
  # T140 P1: per-row activation gate. The "ignition primitive" for the engine —
  # combustion-class subscribers (drive dispatch, integration lane) gate on
  # activation='active'; safety/reconcile subscribers stay ungated. Default
  # 'inactive' means newly created or migrated rows do not auto-combust; the
  # operator must arm them with `tasks activate <id> --reason <text>`. Migration
  # from older DBs preserves currently-running work by backfilling IN_FLIGHT
  # statuses to 'active' (see handlers::framework_migrate::IN_FLIGHT_STATES).
  # actor: ai_with_human gates explicit writes — autonomous flow cannot toggle
  # this field, only the operator (or tier-A token-mediated AI). The activate /
  # deactivate CLI verbs require --reason and persist it as
  # transition_history.actor_note for audit. P2 wires the gating; P1 only ships
  # the column and the verbs.
  - name: activation
    type: enum
    enum_values: [active, inactive]
    required: false
    actor: ai_with_human
    default: 'inactive'
    description: "Per-row activation gate (active|inactive, default inactive). Combustion-class subscribers gate on this in P2; P1 ships the column and the activate/deactivate verbs only."
  # T144/T146: primary task-engine tuple maintained by the framework engine.
  # Consumers must read these columns directly; the historical status field is
  # compatibility-only and is not the semantic source of truth.
  - name: lifecycle
    type: enum
    enum_values: [queued, active, integration, done]
    required: false
    actor: framework
    default: 'queued'
  - name: active_step
    type: enum
    enum_values: [none, planning, planning_review, coding, coding_review, wrapping]
    required: false
    actor: framework
    default: 'none'
  - name: integration_step
    type: enum
    enum_values: [none, queued, refreshing, task_review, testing, merging, deploying, verifying]
    required: false
    actor: framework
    default: 'none'
  - name: post_integration_step
    type: enum
    enum_values: [none, cargo_installed, schema_migrated, deploy_blocked, deploy_verified]
    required: false
    actor: framework
    default: 'none'
    description: 'Stores-repo-specific post-integrated subscriber state; not part of the generic ADR 0001 lifecycle'
  - {name: blocked, type: bool, required: false, actor: framework, default: 0}
  - name: blocker_kind
    type: enum
    enum_values: [capacity, dependency, runner, rate_limit, human_acceptance, task_review, stale_base, config, test_failure, main_red, deploy, migration]
    required: false
    actor: framework
  - name: contract
    type: record
    fields:
      - {name: executive_intent, type: text}
      - {name: done_when, type: text, required: true}
      - {name: scope_in, type: text, required: true}
      - {name: scope_out, type: text, required: true}
      - {name: assumptions, type: text}
  - name: plan
    type: record
    fields:
      - {name: objective, type: text}
      - name: phases
        type: list_record
        fields:
          - {name: name, type: text}
          - {name: objective, type: text}
          - {name: tasks, type: {list: text}}
          - {name: acceptance_criteria, type: {list: text}}
          - {name: files, type: {list: text}}
          - {name: dependencies, type: {list: text}}
  - name: plan_review_log
    type: list_record
    fields:
      - {name: gate, type: enum, enum_values: [READY, NEEDS_WORK, NOT_READY]}
      - {name: summary, type: text}
      - {name: open_questions, type: {list: text}}
      - {name: at, type: timestamp}
      - {name: reviewed_plan, type: json, required: false}
  - name: cycles
    type: list_record
    fields:
      - {name: phase, type: integer}
      - {name: cycle, type: integer}
      - name: executor
        type: record
        fields:
          - {name: summary, type: text}
          - {name: commit, type: text}
          - {name: files_changed, type: {list: text}}
          - {name: notes, type: text}
          - {name: at, type: timestamp}
      - name: review
        type: record
        fields:
          - {name: gate, type: enum, enum_values: [PASS, REVISE, FAIL]}
          - {name: critical, type: integer}
          - {name: major, type: integer}
          - {name: minor, type: integer}
          - {name: summary, type: text}
          - {name: details, type: text}
          - {name: at, type: timestamp}
  - {name: current_phase, type: integer, actor: framework, auto_increment: true}
  - {name: current_cycle, type: integer, actor: framework, auto_increment: true, auto_increment_within: current_phase}
  - name: plan_source
    type: enum
    enum_values: [contract_synthesized, planner_authored]
    required: false
    actor: framework
    description: "Provenance label for the plan record: contract_synthesized when the framework derived a one-phase plan from the contract during skip-plan (T1); planner_authored when the planner agent submitted the plan via submit-plan (T2/T3)."
  - {name: claimed_by, type: text, actor: framework}
  - {name: claimed_at, type: timestamp, actor: framework}
  - {name: blocked_reason, type: text}
  - {name: abandoned_reason, type: text, required: false, actor: framework}
  - {name: abandoned_at, type: timestamp, required: false, actor: framework}
  - {name: integration_blocked_reason, type: text, required: false, actor: framework, description: "Typed failure mode recorded when the integration lane routes to integration_blocked: rebase_conflict | stale_base | stale_external_review | pre_land_check_failed | merge_failure | push_failure."}
  - name: integration_attempts
    type: list_record
    actor: framework
    description: "Append-only audit of integration lane attempts (one entry per integrating-state entry). Stored as a JSON array column on the tasks row."
    fields:
      - {name: attempt_no, type: integer}
      - {name: base_main_sha, type: text}
      - {name: candidate_head_before, type: text}
      - {name: candidate_head_after, type: text}
      - {name: landed_main_sha, type: text}
      - {name: refresh_strategy, type: text}
      - {name: pre_land_check_summary, type: text}
      - {name: reviewed_base_sha, type: text, description: "base_sha of the passed external_review checked for stale_base; null if no ER, or for stale_external_review path where head — not base — is the divergence."}
      - {name: outcome, type: enum, enum_values: [integrated, rebase_conflict, stale_base, stale_external_review, pre_land_check_failed, merge_failure, push_failure]}
      - {name: started_at, type: timestamp}
      - {name: completed_at, type: timestamp}
  - {name: review_base_sha, type: text, required: false, actor: framework}
  - {name: review_head_sha, type: text, required: false, actor: framework}
  - {name: test_base_sha, type: text, required: false, actor: framework}
  - {name: test_head_sha, type: text, required: false, actor: framework}
  - {name: branch_head_sha, type: text, required: false, actor: framework}
  - {name: affected_scope, type: json, required: false, actor: framework, description: "Machine-checkable JSON list of candidate paths affected between review/test base and branch head."}
  - {name: drive_pid, type: integer, required: false, actor: framework}
  - {name: drive_started_at, type: timestamp, required: false, actor: framework}
  - name: wrap_log
    type: list_record
    fields:
      - {name: executive_summary, type: text}
      - {name: deviations, type: {list: text}}
      - {name: residual_risks, type: {list: text}}
      - {name: recommended_sanity_checks, type: {list: text}}
      - {name: reject_reason, type: text}
      - {name: at, type: timestamp}

lifecycle:
  states: [queued, active, integration, done, planning, plan_review, ready, executing, code_review, blocked, complete, in_review, accepted, rejected, integration_queued, integrating, integration_blocked, integrated, closed_out_of_band, abandoned]
  initial_state: planning
  transitions:
    # close-out-of-band: tier-A recovery terminal for tasks whose work merged
    # to main without going through the substrate's accept verb (typical for
    # tasks where review/wrap/accept were skipped). Refused from terminal-ish
    # states (accepted, closed_out_of_band); legacy cargo_installed/schema_migrated compatibility is handled by lifecycle_overlay;
    # allowed from every other state. The `--commit` SHA is the merge-target
    # provenance and is recorded in transition_history.actor_note.
    - {from: planning, to: closed_out_of_band, verb: close-out-of-band, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: closed_out_of_band}
    - {from: plan_review, to: closed_out_of_band, verb: close-out-of-band, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: closed_out_of_band}
    - {from: ready, to: closed_out_of_band, verb: close-out-of-band, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: closed_out_of_band}
    - {from: executing, to: closed_out_of_band, verb: close-out-of-band, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: closed_out_of_band}
    - {from: code_review, to: closed_out_of_band, verb: close-out-of-band, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: closed_out_of_band}
    - {from: blocked, to: closed_out_of_band, verb: close-out-of-band, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: closed_out_of_band}
    - {from: complete, to: closed_out_of_band, verb: close-out-of-band, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: closed_out_of_band}
    - {from: in_review, to: closed_out_of_band, verb: close-out-of-band, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: closed_out_of_band}
    - {from: rejected, to: closed_out_of_band, verb: close-out-of-band, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: closed_out_of_band}
    - {from: integration_queued, to: closed_out_of_band, verb: close-out-of-band, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: closed_out_of_band}
    - {from: integrating, to: closed_out_of_band, verb: close-out-of-band, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: closed_out_of_band}
    - {from: integration_blocked, to: closed_out_of_band, verb: close-out-of-band, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: closed_out_of_band}
    - {from: integrated, to: closed_out_of_band, verb: close-out-of-band, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: closed_out_of_band}

    # queued → active release. Historical status remains planning; ADR0001 lifecycle flips from queued to active.
    - {from: planning, to: planning, verb: activate-task, actor: framework, guard: "activation == 'active'", lifecycle: active, active_step: planning, integration_step: none, blocked: false, legacy_status: planning}
    - {from: planning, to: planning, verb: release-from-queued, actor: framework, guard: "activation == 'active'", lifecycle: active, active_step: planning, integration_step: none, blocked: false, legacy_status: planning}

    # planning → plan_review (submit-plan)
    - {from: planning, to: plan_review, verb: submit-plan, actor: ai_autonomous, lifecycle: active, active_step: planning_review, integration_step: none, blocked: false, legacy_status: plan_review}

    # planning → ready (skip-plan: T1 tasks bypass planner+plan_review; contract IS the plan)
    - {from: planning, to: ready, verb: skip-plan, actor: framework, guard: "tier_hint == 'T1'", lifecycle: active, active_step: none, integration_step: none, blocked: false, legacy_status: ready}

    # plan_review → ready / planning / blocked (gate-keyed by submit-plan-review)
    - {from: plan_review, to: ready, verb: submit-plan-review, actor: ai_autonomous, requires_gate: READY, lifecycle: active, active_step: none, integration_step: none, blocked: false, legacy_status: ready}
    - {from: plan_review, to: planning, verb: submit-plan-review, actor: ai_autonomous, requires_gate: NEEDS_WORK, guard: "plan_review_log.length < 5", lifecycle: active, active_step: planning, integration_step: none, blocked: false, legacy_status: planning}
    # Falls through when above guard fails (6th NEEDS_WORK)
    - {from: plan_review, to: blocked, verb: submit-plan-review, actor: ai_autonomous, requires_gate: NEEDS_WORK, lifecycle: active, active_step: none, integration_step: none, blocked: true, blocker_kind: task_review, legacy_status: blocked}
    - {from: plan_review, to: blocked, verb: submit-plan-review, actor: ai_autonomous, requires_gate: NOT_READY, lifecycle: active, active_step: none, integration_step: none, blocked: true, blocker_kind: task_review, legacy_status: blocked}

    # ready → executing (framework, fired on entry via on_state.ready)
    - {from: ready, to: executing, verb: start, actor: framework, lifecycle: active, active_step: coding, integration_step: none, blocked: false, legacy_status: executing}

    # executing → code_review (submit-execute)
    - {from: executing, to: code_review, verb: submit-execute, actor: ai_autonomous, lifecycle: active, active_step: coding_review, integration_step: none, blocked: false, legacy_status: code_review}

    # code_review → executing / complete / blocked (gate-keyed; PASS branches by current_phase guard per M9)
    # T054: T1 rows now carry a synthesized one-phase plan written during the
    # skip-plan on-entry cascade, so the generic phase-guarded PASS branches
    # below cover T1 correctly (current_phase >= plan.phases.length == 1 ⇒
    # complete). The previously declared T1-specific PASS-to-complete row
    # (with guard `tier_hint == 'T1'`) became redundant once plan IS NULL was
    # eliminated as a T1 representation; it has been removed.
    # PASS-non-last: bump current_phase, reset current_cycle, return to executing
    - {from: code_review, to: executing, verb: submit-review, actor: ai_autonomous, requires_gate: PASS, guard: "current_phase < plan.phases.length", lifecycle: active, active_step: coding, integration_step: none, blocked: false, legacy_status: executing}
    # PASS-last: complete
    - {from: code_review, to: complete, verb: submit-review, actor: ai_autonomous, requires_gate: PASS, guard: "current_phase >= plan.phases.length", lifecycle: active, active_step: wrapping, integration_step: none, blocked: false, legacy_status: complete}
    # REVISE: bump current_cycle (post-increment guard <= 4 means cycles 2/3/4 OK)
    - {from: code_review, to: executing, verb: submit-review, actor: ai_autonomous, requires_gate: REVISE, guard: "current_cycle <= 4", lifecycle: active, active_step: coding, integration_step: none, blocked: false, legacy_status: executing}
    # REVISE-fallback: 4th-revise routes to blocked (no guard; selected when REVISE→executing's guard fails)
    - {from: code_review, to: blocked, verb: submit-review, actor: ai_autonomous, requires_gate: REVISE, lifecycle: active, active_step: none, integration_step: none, blocked: true, blocker_kind: task_review, legacy_status: blocked}
    # FAIL: code-reviewer hard-fail goes to blocked
    - {from: code_review, to: blocked, verb: submit-review, actor: ai_autonomous, requires_gate: FAIL, lifecycle: active, active_step: none, integration_step: none, blocked: true, blocker_kind: task_review, legacy_status: blocked}

    # blocked recovery. Default/user-level blockers resume to planning, but
    # drive_failed infrastructure blockers may resume to the status that was
    # interrupted (recorded in transition_history.from_status for
    # mark_drive_failed). Replanning is for invalid plans/contracts; stale
    # runner processes must not discard phase/cycle progress.
    # Deployment blockage is release-ceremony recovery, not work-cycle resume:
    # use retry-deploy after fixing the deployment issue, or close-out-of-band
    # when manually recovered outside the substrate.
    - {from: blocked, to: planning, verb: resume, actor: ai_with_human, lifecycle: active, active_step: planning, integration_step: none, blocked: false, legacy_status: planning}

    # {planning, plan_review, ready, executing, code_review} → blocked (framework, fired by auto-drive subscriber on drive failure)
    - {from: planning, to: blocked, verb: mark_drive_failed, actor: framework, lifecycle: active, active_step: none, integration_step: none, blocked: true, blocker_kind: runner, legacy_status: blocked}
    - {from: plan_review, to: blocked, verb: mark_drive_failed, actor: framework, lifecycle: active, active_step: none, integration_step: none, blocked: true, blocker_kind: runner, legacy_status: blocked}
    - {from: ready, to: blocked, verb: mark_drive_failed, actor: framework, lifecycle: active, active_step: none, integration_step: none, blocked: true, blocker_kind: runner, legacy_status: blocked}
    - {from: executing, to: blocked, verb: mark_drive_failed, actor: framework, lifecycle: active, active_step: none, integration_step: none, blocked: true, blocker_kind: runner, legacy_status: blocked}
    - {from: code_review, to: blocked, verb: mark_drive_failed, actor: framework, lifecycle: active, active_step: none, integration_step: none, blocked: true, blocker_kind: runner, legacy_status: blocked}

    # accepted → integration_queued (framework, fired on-entry to enqueue the
    # generic integration lane). Replaces the prior direct accepted →
    # cargo install edge: post-accept work is now serialized through the
    # integration lane (queued → integrating → integrated), and post-integrated
    # repo-specific subscribers hang off the integrated state. T138 P1.
    - {from: accepted, to: integration_queued, verb: enqueue-integration, actor: framework, lifecycle: integration, active_step: none, integration_step: none, blocked: false, legacy_status: integration_queued}

    # integration_queued → integrating (framework, fired by builtin:integrate).
    # ADR0001 P3 decomposes the historical singleton "integrating" status into
    # integration_step substeps. Only integration_step='merging' is serialized
    # by the main_branch ResourceLock / partial index; refreshing, task_review,
    # and testing may run in parallel.
    #
    # T140 P2: dual gating on activation. The integrate subscriber's
    # predicate (`activation == 'active'` in agents.yaml) is the primary
    # gate; this schema guard is defense-in-depth so any framework caller
    # bypassing the subscriber still cannot advance an inactive row through
    # the integration lane. The row stays at integration_queued without
    # error; plan-start surfaces it in the `inactive` bucket (P4).
    - {from: integration_queued, to: integrating, verb: start-integration, actor: framework, guard: "activation == 'active'", lifecycle: integration, active_step: none, integration_step: refreshing, blocked: false, legacy_status: integrating}
    - {from: integrating, to: integrating, verb: mark_refresh_done, actor: framework, lifecycle: integration, active_step: none, integration_step: task_review, blocked: false, legacy_status: integrating}
    - {from: integrating, to: integrating, verb: mark_task_review_done, actor: framework, lifecycle: integration, active_step: none, integration_step: testing, blocked: false, legacy_status: integrating}
    - {from: integrating, to: integrating, verb: mark_testing_done, actor: framework, lifecycle: integration, active_step: none, integration_step: merging, blocked: false, legacy_status: integrating}
    - {from: integrating, to: integrating, verb: mark_merge_done, actor: framework, lifecycle: integration, active_step: none, integration_step: deploying, blocked: false, legacy_status: integrating}
    - {from: integrating, to: integrating, verb: mark_deploy_done, actor: framework, lifecycle: integration, active_step: none, integration_step: verifying, blocked: false, legacy_status: integrating}

    # integrating → integrated (framework, fired by builtin:integrate after a
    # successful refresh-against-main, task review freshness, testing,
    # merge/push, deployment, and verification substeps).
    # Subscribers (e.g. stores' cargo-install) hang off the integrated state.
    # T138 P1.
    - {from: integrating, to: integrated, verb: mark_verify_done, actor: framework, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: integrated}
    - {from: integrating, to: integrated, verb: mark_integrated, actor: framework, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: integrated}

    # integrating → integration_blocked (framework, fired by builtin:integrate
    # when refresh-against-main, pre-land check, or merge/push fails). The
    # integration_blocked_reason field records the typed failure mode
    # (rebase_conflict, stale_base, stale_external_review, pre_land_check_failed,
    # merge_failure, push_failure). T138 P1.
    - {from: integrating, to: integration_blocked, verb: mark_integration_blocked, actor: framework, lifecycle: integration, active_step: none, integration_step: none, blocked: true, blocker_kind: main_red, legacy_status: integration_blocked}

    # integration_blocked → integration_queued (ai_with_human, retry the
    # integration after the human has resolved the underlying conflict /
    # stale-review / pre-land failure). NOTE: there is intentionally NO
    # integration_blocked → integrated direct edge — retry must re-traverse
    # integration_queued → integrating → integrated so subscribers fire on the
    # same edge for first attempts and retries. T138 P1.
    - {from: integration_blocked, to: integration_queued, verb: retry-integration, actor: ai_with_human, lifecycle: integration, active_step: none, integration_step: none, blocked: false, legacy_status: integration_queued}

    # complete → in_review (framework on-entry follow-on)
    - {from: complete, to: in_review, verb: request_review, actor: framework, lifecycle: active, active_step: wrapping, integration_step: none, blocked: false, legacy_status: in_review}
    # External review revision route for T2/T3 rows. T1 remains lightweight by
    # default: skip-plan T1 rows do not require an external_review PASS unless a
    # later phase explicitly opts them into that lane.
    - {from: in_review, to: executing, verb: submit-external-review, actor: framework, requires_gate: REVISE, lifecycle: active, active_step: coding, integration_step: none, blocked: false, legacy_status: executing}
    # Narrow ER reconciliation path: if an in-flight external review returns
    # after the task drifted to blocked due to runner/watchdog failure, a
    # current-head REVISE can re-enter execution. Code-side guards restrict
    # this to drive/watchdog blocked_reason values.
    - {from: blocked, to: executing, verb: submit-external-review, actor: framework, requires_gate: REVISE, lifecycle: active, active_step: coding, integration_step: none, blocked: false, legacy_status: executing}

    # in_review acceptance records a durable policy decision; framework release-to-integration performs lane entry.
    - {from: in_review, to: accepted, verb: accept, actor: human, lifecycle: active, active_step: wrapping, integration_step: none, blocked: false, legacy_status: accepted}
    - {from: complete, to: integration_queued, verb: release-to-integration, actor: framework, lifecycle: integration, active_step: none, integration_step: none, blocked: false, legacy_status: integration_queued}
    - {from: in_review, to: integration_queued, verb: release-to-integration, actor: framework, lifecycle: integration, active_step: none, integration_step: none, blocked: false, legacy_status: integration_queued}
    - {from: accepted, to: integration_queued, verb: release-to-integration, actor: framework, lifecycle: integration, active_step: none, integration_step: none, blocked: false, legacy_status: integration_queued}
    - {from: in_review, to: rejected, verb: reject, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: rejected}
    # rejected → planning (amend: re-open contract authoring)
    - {from: rejected, to: planning, verb: amend, actor: ai_with_human, lifecycle: active, active_step: planning, integration_step: none, blocked: false, legacy_status: planning}

    # <non_terminal> → abandoned (T043: walk a stale row to terminal abandoned without burning a drive cycle)
    - {from: planning, to: abandoned, verb: abandon, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: abandoned}
    - {from: plan_review, to: abandoned, verb: abandon, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: abandoned}
    - {from: ready, to: abandoned, verb: abandon, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: abandoned}
    - {from: executing, to: abandoned, verb: abandon, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: abandoned}
    - {from: code_review, to: abandoned, verb: abandon, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: abandoned}
    - {from: blocked, to: abandoned, verb: abandon, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: abandoned}
    - {from: in_review, to: abandoned, verb: abandon, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: abandoned}
    - {from: complete, to: abandoned, verb: abandon, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: abandoned}
    - {from: integration_queued, to: abandoned, verb: abandon, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: abandoned}
    - {from: integrating, to: abandoned, verb: abandon, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: abandoned}
    - {from: integration_blocked, to: abandoned, verb: abandon, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: abandoned}
    - {from: integrated, to: abandoned, verb: abandon, actor: human, lifecycle: done, active_step: none, integration_step: none, blocked: false, legacy_status: abandoned}

workflow:
  max_revise_cycles: 5
  agent_roles:
    planner:
      description: "Creates implementation plans"
    plan_reviewer:
      description: "Reviews plans, READY/NEEDS_WORK/NOT_READY gate"
    executor:
      description: "Executes one phase"
    code_reviewer:
      description: "Reviews phase output, PASS/REVISE/FAIL gate"
    wrap:
      description: "Synthesises completed task into a reviewer brief"
  briefing_templates:
    planner: "templates/planner-brief.md.tpl"
    plan_reviewer: "templates/plan-reviewer-brief.md.tpl"
    executor: "templates/executor-brief.md.tpl"
    code_reviewer: "templates/code-reviewer-brief.md.tpl"
    wrap: "templates/wrap-brief.md.tpl"
  render_template: "templates/main.md.tpl"
  render_target_path: "tasks/{{status_dir}}/{{display_id}}-{{slug}}/main.md"
  submit_targets:
    submit-plan: plan
    submit-plan-review: plan_review_log
    submit-execute: cycles
    submit-review: cycles
    submit-wrap: wrap_log
  on_state:
    planning:
      - {dispatch_agent: planner, when: "tier_hint != 'T1'"}
      - {transition_to: ready, when: "tier_hint == 'T1'"}
    plan_review:
      - dispatch_agent: plan_reviewer
    ready:
      - transition_to: executing
    executing:
      - dispatch_agent: executor
    code_review:
      - dispatch_agent: code_reviewer
    blocked: []
    complete:
      - transition_to: in_review
    in_review:
      - dispatch_agent: wrap
    accepted: []
    integration_queued: []
    integrating: []
    integration_blocked: []
    integrated: []
