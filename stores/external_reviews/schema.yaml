name: external_reviews
id_format: "ER{:03d}"
scope: repo

lifecycle:
  states: [pending, running, passed, revise, tooling_held, superseded]
  initial_state: pending
  transitions:
    - {from: pending, to: running, verb: start-review, actor: framework}
    - {from: running, to: passed, verb: record-verdict, actor: framework, requires_gate: PASS}
    - {from: running, to: revise, verb: record-verdict, actor: framework, requires_gate: REVISE}
    - {from: running, to: tooling_held, verb: record-tooling-failure, actor: framework}
    - {from: pending, to: superseded, verb: supersede, actor: framework}
    - {from: running, to: superseded, verb: supersede, actor: framework}
    - {from: tooling_held, to: pending, verb: retry-review, actor: framework}

fields:
  - {name: task_id, type: text, required: true, description: "tasks.display_id under external review."}
  - {name: attempt, type: integer, required: true, actor: framework, description: "Monotonic external-review attempt per task."}
  - {name: adapter, type: enum, enum_values: [external_review], required: false, description: "Adapter lane that owns this record."}
  - {name: runner, type: enum, enum_values: [codex, pi, claude-code], required: false, description: "Configured review runner."}
  - {name: model_id, type: text, required: false, description: "Runner model identifier when available."}
  - {name: model_metadata, type: json, required: false, description: "Runner/model metadata not captured by scalar fields."}
  - {name: base_sha, type: text, required: false, description: "Review diff base SHA captured at runner spawn time, after any stale-branch rebase preflight."}
  - {name: head_sha, type: text, required: false, description: "Review diff head SHA captured at runner spawn time, after any stale-branch rebase preflight."}
  - {name: verdict, type: enum, enum_values: [PASS, REVISE, TOOLING_FAILURE], required: false, description: "Typed external-review verdict."}
  - {name: critical_count, type: integer, required: false, description: "Critical finding count."}
  - {name: major_count, type: integer, required: false, description: "Major finding count."}
  - {name: minor_count, type: integer, required: false, description: "Minor finding count."}
  - {name: started_at, type: timestamp, required: false, description: "Review runner start time."}
  - {name: completed_at, type: timestamp, required: false, description: "Review runner completion time."}
  - {name: duration_ms, type: integer, required: false, description: "Runner wall-clock duration in milliseconds."}
  - {name: log_path, type: text, required: false, description: "Path to runner log."}
  - {name: transcript_path, type: text, required: false, description: "Path to runner transcript."}
  - {name: contract_ref, type: text, required: false, description: "Reference to reviewed contract input."}
  - {name: plan_ref, type: text, required: false, description: "Reference to reviewed plan input."}
  - {name: wrap_log_ref, type: text, required: false, description: "Reference to reviewed wrap_log input."}
  - {name: diff_ref, type: text, required: false, description: "Reference to reviewed diff/base/head input."}
  - {name: prior_review_ref, type: text, required: false, description: "Reference to prior review context input."}
  - {name: held_reason, type: text, required: false, description: "Framework tooling hold reason such as cap-held, runner/tooling failure text, or stale_base_requires_rebase."}
  - {name: next_retry_at, type: timestamp, required: false, description: "Retry eligibility for retryable tooling_held rows; stale_base_requires_rebase holds are not auto-retried."}
  - {name: attempts, type: integer, required: false, description: "Number of daemon attempts that claimed this external review row."}
  - {name: findings, type: list_record, required: false, description: "Structured findings emitted by the runner or tooling hold diagnostics.", fields: [{name: severity, type: enum, enum_values: [critical, major, minor]}, {name: summary, type: text}, {name: detail, type: text}, {name: path, type: text}, {name: line, type: integer}]}

workflow:
  render_template: "templates/main.md.tpl"
  render_target_path: "external-reviews/{{display_id}}/main.md"
