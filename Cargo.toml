[package]
name = "stores"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "stores"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "string"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
anyhow = "1"
thiserror = "1"
handlebars = "5"
libc = "0.2"

[features]
default = []
runner-claude-code = []

[dev-dependencies]
tempfile = "3"
