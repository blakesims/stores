[package]
name = "stores"
version = "0.4.1"
edition = "2021"

[[bin]]
name = "stores"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "string"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
anyhow = "1"
thiserror = "1"
handlebars = "5"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
jsonschema = { version = "0.18", optional = true }

[features]
default = []
runner-claude-code = ["dep:jsonschema"]

[dev-dependencies]
tempfile = "3"
jsonschema = "0.18"
