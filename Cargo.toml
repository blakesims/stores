[package]
name = "stores"
version = "0.5.0"
edition = "2021"

[[bin]]
name = "stores"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "string"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
anyhow = "1"
thiserror = "1"
handlebars = "5"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
subtle = "2"
getrandom = "0.2"
hex = "0.4"
jsonschema = { version = "0.18", optional = true }
ratatui = "0.28"
crossterm = "0.28"
tempfile = "3"
chrono = { version = "0.4", features = ["std"], default-features = false }
unicode-width = "0.1"

[features]
default = ["runner-claude-code", "runner-pi"]
runner-claude-code = ["dep:jsonschema"]
runner-pi = ["dep:jsonschema"]

[dev-dependencies]
tempfile = "3"
jsonschema = "0.18"
