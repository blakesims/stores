# Reference `.stores/agents.yaml` — the generic integration lane plus the
# stores-specific post-`integrated` chain (T138).
#
# Post-T146 ceremony for a row whose acceptance policy permits release:
#
#   1. builtin:release-to-integration fires from the framework subscriber and
#      moves complete/in_review/accepted → integration_queued.
#   2. builtin:integrate (this file) — the generic, repo-agnostic
#      integration lane. Subscribes to (complete|in_review|accepted→integration_queued)
#      and (integration_blocked→integration_queued). Advances ADR0001
#      integration_step through refreshing → task_review → testing →
#      merging → deploying → verifying, refreshes the candidate against
#      current main via the configured `refresh_strategy`, re-checks the
#      candidate's external_review HEAD freshness, runs the configured
#      `pre_land_check` command, fast-merges into main while holding only
#      the main_branch ResourceLock, and on success fires `mark_verify_done`.
#      Failure surfaces as `mark_integration_blocked` with a typed
#      `integration_blocked_reason`
#      (rebase_conflict | stale_base | stale_external_review |
#      pre_land_check_failed | merge_failure | push_failure). The
#      integration lane records single-record provenance per attempt in
#      `tasks.integration_attempts`.
#   3. builtin:cargo-install (T019, repo-specific) — refresh the stores
#      binary. Subscribes ONLY to (integrating→integrated). On success
#      fires `mark_cargo_installed` (integrated→cargo_installed).
#   4. builtin:schema-migrate (T019, repo-specific) — apply additive DB
#      migrations. Subscribes to (integrated→cargo_installed) and on
#      success fires `mark_schema_migrated`.
#
# `stale_base` vs `stale_external_review` are distinct typed integration
# blockers. `stale_base` is a PRE-REBASE check: the lane runs
# `git merge-base --is-ancestor <reviewed_base_sha> <main_branch>` against
# the latest passed external_review's base_sha BEFORE running rebase or
# advancing main; if the reviewed base is no longer reachable from main
# (force-push / history rewrite suspected), the ER is superseded and the
# row routes to `integration_blocked` with outcome 'stale_base' WITHOUT
# touching main. `stale_external_review` is the POST-REBASE counterpart:
# after a clean refresh, the reviewed head_sha no longer matches the
# candidate head, the ER is superseded, and the row routes to
# `integration_blocked` with outcome 'stale_external_review'. Both
# blockers recover via human-grounded `retry-integration`
# (integration_blocked→integration_queued). See `docs/integration-lane.md`
# for the full lifecycle, configuration shape, and outcome enum.
#
# cargo-install and schema-migrate are stores-repo-specific subscribers.
# A different repo wiring this surface would NOT include cargo-install or
# schema-migrate; it would hang its own post-integrated chain off
# (integrating→integrated). The integration lane itself is generic and
# fires nothing repo-specific after `integrated`.
#
# NOTE: there is no (integration_blocked→integrated) edge in the schema —
# integration retries must re-traverse integration_queued → integrating
# → integrated so the integrate lane and post-integrated subscribers
# fire on the recovery path. cargo-install therefore subscribes ONLY to
# (integrating→integrated), never to (integration_blocked→integrated).
#
# Failure at the cargo-install or schema-migrate link still flips the row
# to `deploy_blocked` with `blocked_reason` populated, ntfy fires, and the
# row is dispatched to `deployment_specialist` (default
# `builtin:user-escalation`). `stores tasks retry-deploy` recovers the
# release-ceremony chain; `stores tasks retry-integration` recovers the
# integration lane.

agents:
  - name: release-to-integration
    subscribes_to:
      - store: tasks
        transition: { from: code_review, to: complete }
        predicate:
          op: "=="
          left: "$activation"
          right: "active"
      - store: tasks
        transition: { from: complete, to: in_review }
        predicate:
          op: "=="
          left: "$activation"
          right: "active"
      - store: tasks
        transition: { from: in_review, to: accepted }
        predicate:
          op: "=="
          left: "$activation"
          right: "active"
    command: "builtin:release-to-integration"
    claim_window_secs: 300
    retry_policy: { max_attempts: 1, backoff: linear }

  - name: integrate
    subscribes_to:
      - store: tasks
        transition: { from: accepted, to: integration_queued }
        predicate:
          op: "=="
          left: "$activation"
          right: "active"
      - store: tasks
        transition: { from: complete, to: integration_queued }
        predicate:
          op: "=="
          left: "$activation"
          right: "active"
      - store: tasks
        transition: { from: in_review, to: integration_queued }
        # T140 P2: per-row activation gate on the work-starting class.
        # Inactive rows enqueue (so plan-start surfaces them) but never
        # enter the integration lane until an operator activates them.
        predicate:
          op: "=="
          left: "$activation"
          right: "active"
      - store: tasks
        transition: { from: integration_blocked, to: integration_queued }
        predicate:
          op: "=="
          left: "$activation"
          right: "active"
    command: "builtin:integrate"
    claim_window_secs: 1800
    retry_policy: { max_attempts: 1, backoff: linear }
    command_args:
      pre_land_check: "cargo check --quiet"
      refresh_strategy: rebase
      allow_push: false

  # Optional per-step registrations may subscribe to ADR0001 integration_step
  # self-transitions, but they must use step-specific commands. The monolithic
  # `builtin:integrate` above owns the whole lane and always begins with
  # `start-integration`, so do not register it on `integrating -> integrating`
  # substep edges.

  - name: cargo-install
    subscribes_to:
      - store: tasks
        transition: { from: integrating, to: integrated }
    command: "builtin:cargo-install"
    claim_window_secs: 600
    retry_policy: { max_attempts: 1, backoff: linear }
    command_args:
      features:
        - runner-claude-code

  - name: schema-migrate
    subscribes_to:
      - store: tasks
        transition: { from: integrated, to: integrated }
        predicate:
          op: "=="
          left: "$post_integration_step"
          right: "cargo_installed"
    command: "builtin:schema-migrate"
    claim_window_secs: 300
    retry_policy: { max_attempts: 1, backoff: linear }

  - name: auto-resolve-observation
    subscribes_to:
      - store: tasks
        transition: { from: cargo_installed, to: schema_migrated }
      - store: tasks
        transition: { from: integrating, to: integrated }
      - store: tasks
        transition: { from: planning, to: closed_out_of_band }
      - store: tasks
        transition: { from: plan_review, to: closed_out_of_band }
      - store: tasks
        transition: { from: ready, to: closed_out_of_band }
      - store: tasks
        transition: { from: executing, to: closed_out_of_band }
      - store: tasks
        transition: { from: code_review, to: closed_out_of_band }
      - store: tasks
        transition: { from: blocked, to: closed_out_of_band }
      - store: tasks
        transition: { from: complete, to: closed_out_of_band }
      - store: tasks
        transition: { from: in_review, to: closed_out_of_band }
      - store: tasks
        transition: { from: rejected, to: closed_out_of_band }
      - store: tasks
        transition: { from: deploy_blocked, to: closed_out_of_band }
    command: "builtin:auto-resolve-observation"
    claim_window_secs: 300
    retry_policy: { max_attempts: 1, backoff: linear }

  - name: user-escalation
    # Invoked via `deployment_specialist` by failure paths; no legacy
    # deploy_blocked status subscriber edges in ADR0001 primary lifecycle mode.
    subscribes_to: []
    command: "builtin:user-escalation"
    claim_window_secs: 300
    retry_policy: { max_attempts: 1, backoff: linear }

  # T022 — auto-drive. Fires on the row-creation arrival edge ('' → planning)
  # only when `workspace_path` is set on the row (the predicate gate skips
  # rows scaffolded without an isolated worktree). The daemon spawns
  # `stores tasks drive <id>` detached so the polling loop continues; concurrency
  # is capped by `drive.max_parallel` in .stores/config.yaml below.
  # T038 — investigator. Routes a freshly-flipped open→needs_investigation
  # observation to a dedicated subagent that emits a PULL-SHAPED evidence
  # envelope (NOT a draft contract). The builtin parses the envelope, runs
  # a status guard (no-op if the row moved on), and persists evidence to
  # `investigation_note` + `notes`. The human ratifies the contract next —
  # the investigator does not pre-decide acceptance, scope, or done-when.
  - name: investigator
    subscribes_to:
      - store: observations
        transition: { from: open, to: needs_investigation }
    command: "builtin:investigator"
    claim_window_secs: 600
    retry_policy: { max_attempts: 1, backoff: linear }

  - name: auto-drive
    subscribes_to:
      - store: tasks
        transition: { from: "", to: planning }
        # T140 P2: ignition gate. workspace_path must be set AND the row
        # must be active before auto-drive combusts. all_of composes the
        # two predicates with logical AND.
        predicate:
          op: all_of
          all:
            - op: "!="
              left: "$workspace_path"
              right: ""
            - op: "=="
              left: "$activation"
              right: "active"
    command: "builtin:auto-drive"
    claim_window_secs: 300
    retry_policy: { max_attempts: 1, backoff: linear }

  - name: external-review
    subscribes_to:
      - store: external_reviews
        transition: { from: "", to: pending }
      - store: external_reviews
        transition: { from: tooling_held, to: pending }
    command: "builtin:external-review"
    claim_window_secs: 1800
    retry_policy: { max_attempts: 1, backoff: linear }

  # T053 P4 — intake gatekeeper. Production is shell-out: the command renders
  # a bundled brief, asks the configured agent CLI for one JSON decision, then
  # calls `stores intake route` (the single P1 routing verb). All six decisions
  # — including `arch_review_candidate` — flow through `route`; the dedicated
  # `architecture_reviews` store / `escalated` lifecycle is deferred to L171.
  # Tests may replace this with `builtin:gatekeeper-stub` to avoid LLM IO.
  - name: gatekeeper
    subscribes_to:
      - store: intake
        transition: { from: draft, to: triaging }
    command: >-
      sh -c 'tmp=$(mktemp); stores intake brief "$STORES_DISPLAY_ID" --for gatekeeper | claude --print > "$tmp"; decision=$(jq -r .decision "$tmp"); stores intake route "$STORES_DISPLAY_ID" --decision "$decision" --gatekeeper-decision-json-from-file "$tmp" --invoker ai_autonomous'
    claim_window_secs: 600
    retry_policy: { max_attempts: 1, backoff: linear }

  - name: recon
    subscribes_to:
      - store: intake
        transition: { from: triaging, to: needs_info }
    command: "stores intake brief ${STORES_DISPLAY_ID} --for recon | claude --print | sh"
    claim_window_secs: 600
    retry_policy: { max_attempts: 1, backoff: linear }

deployment_specialist: user-escalation

# ---------------------------------------------------------------------------
# .stores/config.yaml — supplemental
# ---------------------------------------------------------------------------
# These keys live in `.stores/config.yaml` (NOT this file). Documented here so
# operators can find every project-tunable knob in one place.
#
# ntfy:
#   url: https://ntfy.example/your-topic    # falls back to $STORES_NTFY_URL
#
# scaffold:
#   command: "./dev scaffold {display_id}"  # auto-scaffold subscriber (T020)
#
# drive:
#   max_parallel: 1   # auto-drive concurrency cap. Default: 1.
#                     # Caps how many `tasks drive` subprocesses the daemon
#                     # will spawn concurrently. Raise on multi-worktree setups
#                     # where parallel drives are safe.
#
# review:
#   runner: codex      # codex, pi, or claude-code. Default: codex.
#   max_parallel: 1    # external-review lane concurrency cap. Default: 1.
#   timeout_secs: 1800
#   model: gpt-5-codex # optional runner/model metadata persisted on review rows.
# codex:
#   command: codex
#   args: ["review", "--stdin"]
#
# Pi review runner example:
# review: { runner: pi, max_parallel: 1, timeout_secs: 1800, model: pi-review }
#
# Claude Code review runner example:
# review: { runner: claude-code, max_parallel: 1, timeout_secs: 1800, model: sonnet }
#
# T2/T3 accept precheck: a current-head external_reviews PASS is required.
# REVISE routes back to executor; TOOLING_FAILURE becomes tooling_held with
# held_reason/next_retry_at visible to agents-run/watch logs.
